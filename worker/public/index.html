<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/viewer.css">
    <script src="/viewer.js" defer></script>
  </head>
  <body class="watch-body">
    <header class="watch-bar">
      <img class="watch-mark" src="/favicon.svg" alt="" width="22" height="22">
      <span class="watch-brand">ClipShare</span>
    </header>
    <main class="watch">
      <h1 class="watch-title">{{title}}</h1>
      <p class="watch-meta">{{meta}}</p>
      <div class="watch-frame">
        <video controls controlslist="nodownload noremoteplayback" disablepictureinpicture playsinline preload="metadata" src="{{mediaUrl}}"></video>
      </div>
      <p id="playback-error" hidden>This browser can't play this video. Try Safari, Chrome, or Firefox.</p>
    </main>
    <footer class="watch-foot">Shared privately with ClipShare</footer>
  </body>
</html>
