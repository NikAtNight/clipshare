<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/viewer.css">
    <script src="/viewer.js" defer></script>
  </head>
  <body>
    <main>
      <h1>{{title}}</h1>
      <video controls controlslist="nodownload noremoteplayback" disablepictureinpicture playsinline preload="metadata" src="{{mediaUrl}}"></video>
      <p id="playback-error" hidden>This browser can't play this video.</p>
    </main>
  </body>
</html>
