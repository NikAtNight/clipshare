<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClipShare</title>
    <link rel="stylesheet" href="/viewer.css">
  </head>
  <body class="home-body">
    <main class="home">
      <svg class="home-mark" viewBox="0 0 96 96" role="img" aria-label="ClipShare">
        <rect x="8" y="16" width="80" height="64" rx="14" fill="none" stroke="currentColor" stroke-width="4"/>
        <path d="M40 34 L62 48 L40 62 Z" fill="currentColor"/>
        <circle cx="72" cy="28" r="7" fill="#0c1220" stroke="currentColor" stroke-width="4"/>
      </svg>
      <h1 class="home-title">ClipShare</h1>
      <p class="home-tagline">Private video sharing.</p>
      <p class="home-copy">Videos here live behind links that were sent to specific people. If someone sent you one, open that link and it will play right here in your browser.</p>
      <ul class="home-facts">
        <li>No accounts</li>
        <li>No downloads</li>
        <li>Links that can be switched off</li>
      </ul>
      <p class="home-foot">A Talix project</p>
    </main>
  </body>
</html>
